name: iOS release (GeoSenEsm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Restore App Store Connect API key and .env
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$key_path"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 -d > "$key_path"
          fi
          openssl pkey -in "$key_path" -noout \
            || { echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env

      - run: flutter pub get

      - run: flutter build ios --release --config-only --dart-define=APP_TYPE=geosenesm

      - run: pod install
        working-directory: ios

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/ios/Runner.xcarchive "${auth[@]}"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa "${auth[@]}"
