name: Store release (GeoSenEsm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_NAME: urbeat.site.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Restore keystore and key.properties
        env:
          GEOSENESM_KEYSTORE_BASE64: ${{ secrets.GEOSENESM_KEYSTORE_BASE64 }}
          GEOSENESM_STORE_PASSWORD: ${{ secrets.GEOSENESM_STORE_PASSWORD }}
          GEOSENESM_KEY_PASSWORD: ${{ secrets.GEOSENESM_KEY_PASSWORD }}
          GEOSENESM_KEY_ALIAS: ${{ secrets.GEOSENESM_KEY_ALIAS }}
        run: |
          keystore_path="$RUNNER_TEMP/geosenesm.jks"
          echo "$GEOSENESM_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          {
            echo "geosenesm.storePassword=$GEOSENESM_STORE_PASSWORD"
            echo "geosenesm.keyPassword=$GEOSENESM_KEY_PASSWORD"
            echo "geosenesm.keyAlias=$GEOSENESM_KEY_ALIAS"
            echo "geosenesm.storeFile=$keystore_path"
          } > android/key.properties

      - run: flutter pub get

      - name: Build signed app bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env
          bash scripts/build-android-geosenesm.sh appbundle

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-geosenesm-release.aab
          tracks: internal
          status: completed

      - name: Cleanup secrets
        if: always()
        run: rm -f .env android/key.properties "$RUNNER_TEMP/geosenesm.jks"

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Restore App Store Connect API key and .env
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$key_path"
          else
            echo "$ASC_KEY_P8_BASE64" | base64 -d > "$key_path"
          fi
          openssl pkey -in "$key_path" -noout \
            || { echo "::error::ASC_KEY_P8_BASE64 is not a valid App Store Connect .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN" > .env

      - run: flutter pub get

      - run: flutter build ios --release --config-only --dart-define=APP_TYPE=geosenesm

      - run: pod install
        working-directory: ios

      - name: Archive, sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/ios/Runner.xcarchive "${auth[@]}"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa "${auth[@]}"
