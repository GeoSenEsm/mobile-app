name: Release to stores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.x'

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: geosenesm
            secret_prefix: GEOSENESM
            package_name: com.example.survey_frontend
          - variant: urbeat
            secret_prefix: URBEAT
            package_name: appcn.urbeat.site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.secret_prefix)] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_STORE_PASSWORD', matrix.secret_prefix)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.secret_prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.secret_prefix)] }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          cat > android/key.properties <<EOF
          ${{ matrix.variant }}.storeFile=upload.jks
          ${{ matrix.variant }}.storePassword=$STORE_PASSWORD
          ${{ matrix.variant }}.keyPassword=$KEY_PASSWORD
          ${{ matrix.variant }}.keyAlias=$KEY_ALIAS
          EOF

      - run: bash scripts/build-android-${{ matrix.variant }}.sh appbundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-aab
          path: build/app/outputs/bundle/release/app-${{ matrix.variant }}-release.aab

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ matrix.package_name }}
          releaseFiles: build/app/outputs/bundle/release/app-${{ matrix.variant }}-release.aab
          track: internal
          status: draft

  ios-urbeat:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --config-only --dart-define=APP_TYPE=urbeat

      - run: pod install
        working-directory: ios

      - name: Restore App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive, sign and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/ios/Runner.xcarchive "${auth[@]}"
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa "${auth[@]}"
