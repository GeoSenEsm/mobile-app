plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def appType = (project.findProperty('appType') ?: System.getenv('APP_TYPE') ?: 'geosenesm')
        .toString()
        .trim()
        .toLowerCase(Locale.ROOT)

def appConfigs = [
        geosenesm: [
        appName      : 'GeoSenEsm',
        applicationId: 'com.example.survey_frontend',
        ],
        urbeat    : [
        appName      : 'UrbEaT',
        applicationId: 'appcn.urbeat.site',
        ],
]

if (!appConfigs.containsKey(appType)) {
    throw new GradleException("Unsupported APP_TYPE '${appType}'. Supported values: ${appConfigs.keySet().join(', ')}")
}

def selectedAppConfig = appConfigs[appType]
def signingPropertyPrefix = "${appType}."
def requiredSigningKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
def selectedSigningConfig = requiredSigningKeys.collectEntries { key ->
    [(key): keystoreProperties["${signingPropertyPrefix}${key}"]]
}

if (!keystorePropertiesFile.exists()) {
    throw new GradleException('Missing android/key.properties file.')
}

requiredSigningKeys.each { requiredKey ->
    if (!selectedSigningConfig[requiredKey]) {
        throw new GradleException("Missing '${signingPropertyPrefix}${requiredKey}' in android/key.properties.")
    }
}

android {
    namespace "com.example.survey_frontend"
    compileSdk rootProject.ext.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId selectedAppConfig.applicationId
        resValue "string", "app_name", selectedAppConfig.appName
        multiDexEnabled true
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias = selectedSigningConfig.keyAlias
            keyPassword = selectedSigningConfig.keyPassword
            storeFile = file(selectedSigningConfig.storeFile)
            storePassword = selectedSigningConfig.storePassword
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source '../..'
}

dependencies {
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
